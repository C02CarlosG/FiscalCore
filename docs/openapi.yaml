  /api/v1/validaciones-cfdi/empresas/{empresa_id}:
    get:
      operationId: resumenValidacionesCfdi
      tags: [Validaciones de CFDI]
      summary: Conteo del periodo y del acumulado por validación, en emitidos y recibidos
      description: |
        Solo CFDI vigentes. Validaciones: pue_forma_99, pue_con_rep, egreso_sin_relacion
        (emitidos y recibidos), no_bancarizado y gas_efectivo (solo recibidos; esta es
        una advertencia, `tipo: advertencia`). Una validación inactiva trae conteos null.
        V1, carril D.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: periodo, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: Tarjetas por dirección
  /api/v1/suscripcion:
    get:
      operationId: miSuscripcion
      tags: [Suscripción]
      summary: Plan efectivo de la cuenta, uso de RFC y si puede agregar otro
      description: |
        Sin suscripción vigente (no asignada, suspendida, cancelada o vencida) aplica el plan
        por defecto; `motivo` dice por qué. El uso cuenta las empresas activas que la cuenta
        administra. El administrador de la plataforma no tiene límite. M7.1, carril D.
      responses:
        '200':
          description: Suscripción de la cuenta
          content:
            application/json:
              schema:
                type: object
                properties:
                  periodo: { type: string }
                  configuracion: { $ref: '#/components/schemas/ConfiguracionValidacionesCfdi' }
                  emitidos: { type: array, items: { $ref: '#/components/schemas/TarjetaValidacionCfdi' } }
                  recibidos: { type: array, items: { $ref: '#/components/schemas/TarjetaValidacionCfdi' } }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          $ref: '#/components/responses/UnprocessableError'

  /api/v1/validaciones-cfdi/empresas/{empresa_id}/cfdis:
    get:
      operationId: cfdisValidacionCfdi
      tags: [Validaciones de CFDI]
      summary: CFDI que componen una tarjeta (hasta 500)
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: periodo, in: query, required: true, schema: { type: string } }
        - { name: direccion, in: query, required: true, schema: { type: string, enum: [emitidos, recibidos] } }
        - { name: validacion, in: query, required: true, schema: { type: string, enum: [pue_forma_99, pue_con_rep, egreso_sin_relacion, no_bancarizado, gas_efectivo] } }
        - { name: alcance, in: query, required: false, schema: { type: string, enum: [periodo, acumulado], default: periodo } }
      responses:
        '200':
          description: CFDI por fecha de emisión y total de filas
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_filas: { type: integer }
                  cfdis:
                    type: array
                    items:
                      type: object
                      properties:
                        uuid: { type: string }
                        fecha_emision: { type: string, format: date-time }
                        serie: { type: string, nullable: true }
                        folio: { type: string, nullable: true }
                        rfc: { type: string, description: RFC de la contraparte }
                        nombre: { type: string, nullable: true }
                        total: { type: number }
                        moneda: { type: string }
                        forma_pago: { type: string, nullable: true }
                        metodo_pago: { type: string, nullable: true }
                        tipo_comprobante: { type: string }
                  plan: { $ref: '#/components/schemas/Plan' }
                  estado: { type: string, nullable: true, enum: [activa, suspendida, cancelada, null] }
                  vigente_hasta: { type: string, format: date, nullable: true }
                  motivo: { type: string, nullable: true, enum: [sin_suscripcion, suspendida, cancelada, vencida, plan_no_disponible, null] }
                  uso_rfc: { type: integer }
                  puede_agregar_rfc: { type: boolean }
                  dias_para_vencer: { type: integer, nullable: true, description: "Días para el vencimiento si es en 15 días o menos; negativo si ya venció (aviso solo en la interfaz, D10)" }
                  es_admin_plataforma: { type: boolean }
        '401':
          $ref: '#/components/responses/UnauthorizedError'

