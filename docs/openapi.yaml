      operationId: actualizar_impuestos_api_v1_empresas__empresa_id__impuestos_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: empresa_id
        in: path
        required: true
        schema:
          type: string
          title: Empresa Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImpuestosRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
