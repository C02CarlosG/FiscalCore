    DocumentoFiscal:
      type: object
      description: Constancia de situación fiscal u opinión del cumplimiento subida en PDF (F8).
      properties:
        id: { type: string, format: uuid }
        tipo: { type: string, enum: [constancia, opinion] }
        nombre_archivo: { type: string }
        tamano_bytes: { type: integer }
        rfc: { type: string }
        fecha_emision: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time }
        datos:
          type: object
          description: |
            Lo leído del PDF. Constancia: razon_social (en persona física, nombre y apellidos),
            regimenes, cp_fiscal, id_cif, estatus_padron. Opinión: razon_social, sentido (positivo, negativo,
            suspension_actividades, inscrito_sin_obligaciones, no_inscrito o null), folio.
            Todo se lee del PDF subido; no se verifica contra el SAT.
        antiguedad_dias: { type: integer, nullable: true }
        vigente_hasta:
          type: string
          format: date
          nullable: true
          description: Solo la opinión positiva (regla 2.1.36 RMF 2026); 30 días naturales contando el de emisión.
        vigente:
          type: boolean
          nullable: true
          description: null en la constancia; false en toda opinión que no sea positiva y vigente.
        motivo:
          type: string
          nullable: true
          enum: [sentido_no_positivo, sentido_no_identificado, sin_fecha, vencida, null]
          description: Por qué la opinión no está vigente.

