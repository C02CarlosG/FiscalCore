      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rfc]
              properties:
                rfc: { type: string, maxLength: 30, description: "Se normaliza a mayusculas. XAXX010101000 se rechaza (422)" }
                nombre: { type: string, maxLength: 300 }
                tipo_tercero: { type: string, enum: ['04', '05', '15'], nullable: true }
                tipo_operacion: { type: string, enum: ['02', '03', '06', '07', '08', '85', '87'], nullable: true, description: "Por defecto 85" }
                pais: { type: string, minLength: 3, maxLength: 3, nullable: true }
                jurisdiccion_detalle: { type: string, maxLength: 300, nullable: true }
                id_fiscal: { type: string, maxLength: 40, nullable: true }
                efectos_fiscales: { type: boolean, nullable: true }
      responses:
        '201':
          description: Proveedor creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proveedor'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: El RFC (no generico) o el ID fiscal del extranjero ya existen
        '422':
          description: RFC, codigos o reglas cruzadas invalidos (el 05 exige ID fiscal y pais; el 04 un RFC no generico; la 87 solo con el 15)

  /api/v1/empresas/{empresa_id}/proveedores/{proveedor_id}:
    patch:
      operationId: editarProveedor
      tags: [Proveedores]
      summary: Edita un proveedor
      description: Solo cambia los campos enviados y queda en la auditoria. Editar el nombre impide que la alimentacion desde los CFDI lo pise; `nombre_editado=false` la reactiva. `nombre` y `nombre_editado` no admiten null.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: proveedor_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre: { type: string, maxLength: 300 }
                nombre_editado: { type: boolean }
                tipo_tercero: { type: string, enum: ['04', '05', '15'], nullable: true }
                tipo_operacion: { type: string, enum: ['02', '03', '06', '07', '08', '85', '87'], nullable: true }
                pais: { type: string, minLength: 3, maxLength: 3, nullable: true }
                jurisdiccion_detalle: { type: string, maxLength: 300, nullable: true }
                id_fiscal: { type: string, maxLength: 40, nullable: true }
                efectos_fiscales: { type: boolean, nullable: true }
      responses:
        '200':
          description: Proveedor actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proveedor'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Proveedor no encontrado
        '409':
          description: Ya existe un extranjero con ese ID fiscal
        '422':
          description: Codigos o reglas cruzadas invalidos

  /api/v1/empresas/{empresa_id}/diot-flujo/{periodo}:
    get:
      operationId: diotFlujo
      tags: [DIOT]
      summary: DIOT del mes por flujo (por tercero y tipo de operacion)
      description: |
        El acreditable del mes visto por tercero, con el mismo motor, ajustes y factor de prorrateo que `/iva-flujo` y la
        cedula de IVA: valor de actos por tasa (incluye exento y no objeto), IVA pagado por tasa, devoluciones, descuentos y
        bonificaciones (valor e IVA en su propia columna), IVA acreditable e IVA no acreditable (por proporcion y por motivo)
        y retenciones. `cuadre_con_iva` confirma que la suma coincide con el acreditable ajustado del resumen de IVA.
        Un tercero con varios tipos de operacion en el periodo sale en varios renglones. **Escribe**: antes de calcular agrega
        al catalogo los proveedores que falten. Las regiones (zona norte/sur) no se calculan: no estan en los datos.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: periodo, in: path, required: true, schema: { type: string, pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$' } }
        - { name: factor, in: query, schema: { type: number, minimum: 0, maximum: 1, default: 1.0 } }
      responses:
        '200':
          description: DIOT del periodo
          content:
            application/json:
              schema:
                type: object
                properties:
                  empresa_id: { type: string }
                  periodo: { type: string }
                  factor_prorrateo: { type: number }
                  terceros: { type: array, items: { type: object, additionalProperties: true } }
                  totales: { type: object, additionalProperties: true }
                  cuadre_con_iva: { type: object, additionalProperties: true }
                  advertencias: { type: array, description: "Avisos del periodo (p. ej. actos a 8 % sin region)", items: { type: object, additionalProperties: true } }
                  advertencias_iva: { type: array, items: { type: object, additionalProperties: true } }
                  operaciones_por_cfdi: { type: integer }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: periodo o factor invalido

  /api/v1/empresas/{empresa_id}/diot-flujo/{periodo}/exportar:
    get:
      operationId: exportarDiotFlujo
      tags: [DIOT]
      summary: Excel de la DIOT del periodo
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: periodo, in: path, required: true, schema: { type: string, pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$' } }
        - { name: factor, in: query, schema: { type: number, minimum: 0, maximum: 1, default: 1.0 } }
      responses:
        '200':
          description: Libro de Excel (hojas DIOT y Totales)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: periodo o factor invalido

  /api/v1/empresas/{empresa_id}/diot-flujo/{periodo}/terceros/{proveedor_id}:
    put:
      operationId: clasificarTerceroDiot
      tags: [DIOT]
      summary: Tipo de tercero y de operacion de un proveedor en este periodo
      description: Lo que no se manda cae al catalogo. Valida las reglas cruzadas (el 05 exige ID fiscal y pais, el 04 un RFC no generico, la 87 solo con el 15). Queda en la auditoria.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: periodo, in: path, required: true, schema: { type: string, pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$' } }
        - { name: proveedor_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tipo_tercero: { type: string, enum: ['04', '05', '15'], nullable: true }
                tipo_operacion: { type: string, enum: ['02', '03', '06', '07', '08', '85', '87'], nullable: true }
      responses:
        '200':
          description: Clasificacion guardada
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Proveedor no encontrado
        '422':
          description: Codigos o reglas cruzadas invalidos
    delete:
      operationId: quitarClasificacionTerceroDiot
      tags: [DIOT]
      summary: Retira la clasificacion del periodo (vuelve a aplicar el catalogo)
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: periodo, in: path, required: true, schema: { type: string, pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$' } }
        - { name: proveedor_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Clasificacion retirada
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Sin clasificacion para ese periodo

  /api/v1/empresas/{empresa_id}/diot-flujo/{periodo}/cfdi/{uuid}:
    put:
      operationId: operacionDeCfdiDiot
      tags: [DIOT]
      summary: Tipo de operacion de un CFDI recibido en este periodo
      description: Con esto un mismo tercero se declara con varias operaciones en el mismo periodo. Manda sobre la clasificacion del tercero. Queda en la auditoria.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: periodo, in: path, required: true, schema: { type: string, pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$' } }
        - { name: uuid, in: path, required: true, schema: { type: string, maxLength: 36 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo_operacion]
              properties:
                tipo_operacion: { type: string, enum: ['02', '03', '06', '07', '08', '85', '87'] }
      responses:
        '200':
          description: Operacion asignada
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: CFDI recibido no encontrado
        '422':
          description: Tipo de operacion invalido, o el CFDI no tiene efecto en ese periodo
    delete:
      operationId: quitarOperacionDeCfdiDiot
      tags: [DIOT]
      summary: Retira la operacion asignada al CFDI
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: periodo, in: path, required: true, schema: { type: string, pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$' } }
        - { name: uuid, in: path, required: true, schema: { type: string, maxLength: 36 } }
      responses:
        '204':
          description: Operacion retirada
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Sin operacion asignada a ese CFDI

  /api/v1/empresas/{empresa_id}/isr-flujo/config/{ejercicio}:
    get:
      operationId: leerConfigIsrFlujo
      tags: [ISR por flujo]
      summary: Porcentaje deducible de la nomina exenta del ejercicio
      description: 0.47 por defecto (LISR 28-XXX); 0.53 si la empresa acredita que las prestaciones exentas no disminuyeron.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: ejercicio, in: path, required: true, schema: { type: integer, minimum: 2000, maximum: 2099 } }
      responses:
        '200':
          description: Configuracion
          content:
            application/json:
              schema:
                type: object
                properties:
                  ejercicio: { type: integer }
                  pct_nomina_exenta: { type: number }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: ejercicio invalido
    put:
      operationId: guardarConfigIsrFlujo
      tags: [ISR por flujo]
      summary: Cambia el porcentaje de nomina exenta del ejercicio (queda en la auditoria)
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: ejercicio, in: path, required: true, schema: { type: integer, minimum: 2000, maximum: 2099 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pct_nomina_exenta]
              properties:
                pct_nomina_exenta: { type: number, enum: [0.47, 0.53] }
      responses:
        '200':
          description: Configuracion guardada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ejercicio: { type: integer }
                  pct_nomina_exenta: { type: number }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: porcentaje o ejercicio invalido

  /api/v1/empresas/{empresa_id}/isr-flujo/ajustes:
    get:
      operationId: listarAjustesIsr
      tags: [ISR por flujo]
      summary: Ajustes "no considerar ISR" vigentes
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      responses:
        '200':
          description: Ajustes, del mas reciente al mas antiguo
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object, additionalProperties: true } }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
    put:
      operationId: guardarAjusteIsr
      tags: [ISR por flujo]
      summary: No considerar un CFDI en el ISR (queda en la auditoria con su motivo)
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuid, lado, motivo]
              properties:
                uuid: { type: string, maxLength: 36 }
                lado: { type: string, enum: [ingreso, deduccion] }
                motivo: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Ajuste guardado
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: El CFDI no existe o no es de ese lado
        '422':
          description: Datos invalidos (el motivo es obligatorio)

  /api/v1/empresas/{empresa_id}/isr-flujo/ajustes/{lado}/{uuid}:
    delete:
      operationId: quitarAjusteIsr
      tags: [ISR por flujo]
      summary: Retira un ajuste (el CFDI vuelve a considerarse)
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: lado, in: path, required: true, schema: { type: string, enum: [ingreso, deduccion] } }
        - { name: uuid, in: path, required: true, schema: { type: string } }
      responses:
        '204':
          description: Ajuste retirado
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Ajuste no encontrado

  /api/v1/empresas/{empresa_id}/isr-flujo/{periodo}:
    get:
      operationId: resumenIsrFlujo
      tags: [ISR por flujo]
      summary: Flujo de ISR del mes y acumulado del ejercicio
      description: |
        Ingresos cobrados (contado y REP, menos devoluciones), deducciones pagadas (compras y gastos, nomina,
        inversiones aparte), ISR retenido a favor y a cargo, y la utilidad fiscal estimada, para el mes y el acumulado
        del ejercicio hasta el. `regimen.modulo` dice si el regimen de la empresa usa este modulo (`flujo`), el
        coeficiente de utilidad (`coeficiente`) o no esta soportado; `regimen.avisos` lista las salvedades del regimen (p. ej. 606: deduccion opcional ciega del 35 %). No calcula el pago provisional.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: periodo, in: path, required: true, schema: { type: string, pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: Flujo de ISR
          content:
            application/json:
              schema:
                type: object
                properties:
                  empresa_id: { type: string }
                  periodo: { type: string }
                  regimen: { type: object, additionalProperties: true }
                  porcentaje_nomina_exenta: { type: number }
                  mes: { type: object, additionalProperties: true }
                  acumulado: { type: object, additionalProperties: true }
                  advertencias: { type: array, items: { type: object, additionalProperties: true } }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: periodo invalido

  /api/v1/empresas/{empresa_id}/isr-flujo/{periodo}/detalle:
    get:
      operationId: detalleIsrFlujo
      tags: [ISR por flujo]
      summary: Los CFDI que componen una cifra del flujo de ISR
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: periodo, in: path, required: true, schema: { type: string, pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$' } }
        - { name: lado, in: query, required: true, schema: { type: string, enum: [ingreso, deduccion] } }
        - { name: bloque, in: query, required: true, schema: { type: string, enum: [contado, credito, devoluciones, nomina, inversiones, no_considerados] } }
        - { name: acumulado, in: query, schema: { type: boolean, default: false } }
        - { name: pagina, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: por_pagina, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: Una pagina de renglones
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object, additionalProperties: true } }
                  total: { type: integer }
                  pagina: { type: integer }
                  por_pagina: { type: integer }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Parametros invalidos

  /api/v1/empresas/{empresa_id}/isr-flujo/{periodo}/exportar:
    get:
      operationId: exportarIsrFlujo
      tags: [ISR por flujo]
      summary: Excel con el detalle de una cifra del ISR por flujo y el resumen del mes y del acumulado
      description: |
        Hoja `Detalle` con todos los renglones de la cifra (base, ISR retenido, nomina, marcas y motivo)
        y hoja `Resumen` con ingresos, deducciones, utilidad fiscal estimada y retenciones del mes y del
        acumulado. Si la cifra pasa de 50,000 renglones responde 422. Queda en la auditoria (`isr_flujo_exportado`).
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: periodo, in: path, required: true, schema: { type: string, pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$' } }
        - { name: lado, in: query, required: true, schema: { type: string, enum: [ingreso, deduccion] } }
        - { name: bloque, in: query, required: true, schema: { type: string, enum: [contado, credito, devoluciones, nomina, inversiones, no_considerados] } }
        - { name: acumulado, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Libro de Excel
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Parametros invalidos o mas de 50,000 renglones

  /api/v1/empresas/{empresa_id}/declaraciones:
    get:
      operationId: listarDeclaraciones
      tags: [Declaraciones]
      summary: Declaraciones capturadas del ejercicio
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: ejercicio, in: query, required: true, schema: { type: integer, minimum: 2000, maximum: 2099 } }
      responses:
        '200':
          description: Las declaraciones capturadas, sin recalcular
          content:
            application/json:
              schema:
                type: object
                properties:
                  ejercicio: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/Declaracion' } }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Ejercicio invalido

  /api/v1/empresas/{empresa_id}/declaraciones/{periodo}:
    get:
      operationId: comparativoDeclarado
      tags: [Declaraciones]
      summary: Lo declarado contra lo calculado de IVA e ISR del periodo
      description: |
        Por impuesto: `estado` (`sin_declaracion`, `cuadra`, `con_diferencias`, `sin_comparar`), los renglones con
        declarado, calculado (a peso) y diferencia (hasta $1.00 es `cuadra`: las declaraciones van en pesos) y `pendiente_de_pago`
        (a cargo de la vigente menos lo pagado de toda la cadena). `sin_comparar` = no hay nada capturado contra nada calculado.
        En IVA el saldo a favor aplicado resta de lo calculado a cargo; en ISR son cifras del mes.
        El pago provisional del ISR no se calcula (F7.3): se muestra solo lo declarado (`sin_calculo`).
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: periodo, in: path, required: true, schema: { type: string, pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$' } }
        - { name: factor, in: query, schema: { type: number, minimum: 0, maximum: 1, default: 1 } }
      responses:
        '200':
          description: Comparativo de IVA e ISR
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Periodo o factor invalidos

  /api/v1/empresas/{empresa_id}/declaraciones/{periodo}/{impuesto}:
    put:
      operationId: guardarDeclaracion
      tags: [Declaraciones]
      summary: Captura o reemplaza la declaracion del periodo e impuesto
      description: |
        Todos los importes son opcionales; solo se compara lo capturado. `tipo: normal` captura (o corrige mientras no haya
        complementarias) la normal; `tipo: complementaria` agrega una nueva al historial y la vigente es la ultima. 409 si
        llega una normal con complementarias o una complementaria sin normal. Queda en la auditoria (`declaracion_guardada`).
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: periodo, in: path, required: true, schema: { type: string, pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$' } }
        - { name: impuesto, in: path, required: true, schema: { type: string, enum: [iva, isr] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tipo: { type: string, enum: [normal, complementaria], default: normal }
                fecha_presentacion: { type: string, format: date, nullable: true }
                numero_operacion: { type: string, maxLength: 40, nullable: true }
                ingresos: { type: number, minimum: 0, nullable: true }
                deducciones: { type: number, minimum: 0, nullable: true }
                impuesto_trasladado: { type: number, minimum: 0, nullable: true }
                impuesto_acreditable: { type: number, minimum: 0, nullable: true }
                retenciones: { type: number, minimum: 0, nullable: true }
                retenciones_a_terceros: { type: number, minimum: 0, nullable: true, description: "Impuesto retenido a terceros por enterar" }
                saldo_a_favor_aplicado: { type: number, minimum: 0, nullable: true, description: "Solo IVA: saldo a favor de periodos anteriores aplicado" }
                impuesto_a_cargo: { type: number, nullable: true, description: "A cargo (+) o a favor (-); el unico importe con signo" }
                monto_pagado: { type: number, minimum: 0, nullable: true }
                notas: { type: string, maxLength: 500 }
      responses:
        '200':
          description: La declaracion guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Declaracion' }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: La captura contradice el historial (normal sobre una complementaria, o complementaria sin normal)
        '422':
          description: Periodo, impuesto o importes invalidos
    delete:
      operationId: eliminarDeclaracion
      tags: [Declaraciones]
      summary: Elimina la declaracion vigente (la ultima del historial)
      description: La anterior, si existe, vuelve a ser la vigente. Queda en la auditoria (`declaracion_eliminada`).
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: periodo, in: path, required: true, schema: { type: string, pattern: '^20[0-9]{2}-(0[1-9]|1[0-2])$' } }
        - { name: impuesto, in: path, required: true, schema: { type: string, enum: [iva, isr] } }
      responses:
        '204':
          description: Eliminada
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: No hay declaracion capturada
        '422':
          description: Periodo o impuesto invalidos

  /api/v1/empresas/{empresa_id}/cedula-iva/{periodo}:
    get:
      operationId: cedulaIva
      tags: [Reportes]
      summary: Cédula mensual de IVA por flujo de efectivo
      description: |
        IVA trasladado, acreditable (con prorrateo Art. 5-V), retenciones, resultado del
        periodo y comparativo contra el IVA devengado (base DIOT). Art. 1-B LIVA.
        Sale del mismo motor (`iva_flujo`) que la pantalla de IVA base flujo y el IVA anual del Inicio.
        `trasladado` y `acreditable` traen `no_considerados` (CFDI e IVA que el motor dejo fuera, con
        `por_motivo`) y `reasignados` (movidos a otro periodo por un ajuste); `excluido_efectivo` se
        conserva por compatibilidad. `iva_retenido` son las retenciones a favor y `retenciones_a_enterar`
        las que la empresa debe enterar. `advertencias` lista las limitaciones del calculo con su
        numero de CFDI.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: periodo, in: path, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, example: "2024-01" }
        - { name: factor, in: query, schema: { type: number, minimum: 0, maximum: 1, default: 1.0 }, description: "Factor de prorrateo (Art. 5-V); 1.0 = 100% gravado" }
      responses:
        '200':
          description: Cédula de IVA del periodo
          content:
            application/json:
              schema:
                type: object
                properties:
                  empresa_id: { type: string }
                  periodo: { type: string }
                  trasladado: { type: object, additionalProperties: true }
                  acreditable: { type: object, additionalProperties: true }
                  iva_retenido: { type: number }
                  retenciones_a_enterar: { type: number }
                  resultado: { type: object, additionalProperties: true }
                  comparativo_sat: { type: object, additionalProperties: true }
                  advertencias:
                    type: array
                    items:
                      type: object
                      properties:
                        codigo: { type: string }
                        mensaje: { type: string }
                        cfdi: { type: integer, nullable: true }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Empresa no encontrada
        '422':
          description: Periodo con formato inválido (se espera YYYY-MM) o factor fuera de 0 a 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/empresas/{empresa_id}/isr-provisional/{periodo}:
    get:
      operationId: isrProvisional
      tags: [Reportes]
      summary: Pago provisional mensual de ISR
      description: Persona moral, régimen general, acumulado del ejercicio a la fecha de corte (base devengado, Art. 14 LISR).
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: periodo, in: path, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, example: "2024-01" }
      responses:
        '200':
          description: Cálculo del pago provisional
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Sin coeficiente de utilidad configurado para el ejercicio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Periodo con formato inválido (se espera YYYY-MM)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/empresas/{empresa_id}/deducciones/{periodo}:
    get:
      operationId: deduccionesAutorizadas
      tags: [Reportes]
      summary: Deducciones autorizadas del periodo
      description: MVP del Art. 27 LISR — "del mes" y "acumulado del ejercicio", clasificadas en gasto / inversión / costo por uso_cfdi.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: periodo, in: path, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }, example: "2024-01" }
      responses:
        '200':
          description: Deducciones del mes y acumuladas del ejercicio
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Periodo con formato inválido (se espera YYYY-MM)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/informacion-fiscal/empresas/{empresa_id}:
    get:
      operationId: resumenInformacionFiscal
      tags: [Información fiscal]
      summary: Constancia y opinión de cumplimiento vigentes de la empresa
      description: |
        De cada tipo, el documento con fecha de emisión más reciente (a igual fecha, el
        último subido). Cada clave es null si nunca se ha subido ese documento. F8, carril D.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      responses:
        '200':
          description: Último documento de cada tipo
          content:
            application/json:
              schema:
                type: object
                properties:
                  constancia: { allOf: [{ $ref: '#/components/schemas/DocumentoFiscal' }], nullable: true }
                  opinion: { allOf: [{ $ref: '#/components/schemas/DocumentoFiscal' }], nullable: true }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/informacion-fiscal/empresas/{empresa_id}/documentos:
    get:
      operationId: historialDocumentosFiscales
      tags: [Información fiscal]
      summary: Historial de documentos fiscales subidos (sin el PDF)
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: tipo, in: query, required: false, schema: { type: string, enum: [constancia, opinion] } }
      responses:
        '200':
          description: Documentos, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentoFiscal' }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: tipo inválido

  /api/v1/informacion-fiscal/empresas/{empresa_id}/documentos/{tipo}:
    post:
      operationId: subirDocumentoFiscal
      tags: [Información fiscal]
      summary: Subir constancia de situación fiscal u opinión de cumplimiento (PDF)
      description: |
        Valida extensión `.pdf`, tipo de contenido, tamaño (5 MB), firma `%PDF-`,
        hasta 10 páginas, que el documento sea del tipo indicado y que su RFC sea
        el de la empresa. El mismo PDF dos veces responde 409.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: tipo, in: path, required: true, schema: { type: string, enum: [constancia, opinion] } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo: { type: string, format: binary }
      responses:
        '201':
          description: Documento guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentoFiscal' }
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '413':
          description: El archivo excede 5 MB
        '422':
          $ref: '#/components/responses/UnprocessableError'
        '429':
          description: Más de 20 cargas por minuto

  /api/v1/informacion-fiscal/empresas/{empresa_id}/documentos/{documento_id}/pdf:
    get:
      operationId: pdfDocumentoFiscal
      tags: [Información fiscal]
      summary: PDF original del documento (visor o descarga)
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: documento_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: descargar, in: query, required: false, schema: { type: boolean, default: false }, description: 'true responde con Content-Disposition attachment; si no, inline' }
      responses:
        '200':
          description: El PDF tal como se subió
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/informacion-fiscal/empresas/{empresa_id}/documentos/{documento_id}:
