openapi: 3.1.0
info:
  title: "Plataforma de Auditor\xEDa Fiscal Preventiva"
  description: "Sistema de detecci\xF3n autom\xE1tica de riesgos fiscales (SAT interno)"
  version: 1.0.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: Registrar
      description: "Registra un contador (usuario). Retorna JWT. Las empresas se agregan\
        \ despu\xE9s con POST /mis-empresas."
      operationId: registrar_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login
      description: Autentica un contador y retorna JWT + lista de empresas que administra.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Me
      description: Retorna info del usuario autenticado y sus empresas.
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v1/usuarios/perfil:
    patch:
      tags:
      - Auth
      summary: Actualizar Perfil
      description: Actualiza los datos de perfil del contador autenticado.
      operationId: actualizar_perfil_api_v1_usuarios_perfil_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/constancia/parsear:
    post:
      tags:
      - Empresas
      - Constancia
      summary: Parsear Constancia Pdf
      description: "Extrae datos fiscales de la Constancia de Situaci\xF3n Fiscal\
        \ (PDF SAT).\n\nEl PDF se procesa en memoria y no se conserva: nada en la\
        \ app lo consulta\ndespu\xE9s, y guardarlo dejaba datos fiscales de terceros\
        \ en disco sin due\xF1o."
      operationId: parsear_constancia_pdf_api_v1_constancia_parsear_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_parsear_constancia_pdf_api_v1_constancia_parsear_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/empresas:
    get:
      tags:
      - Empresas
      summary: Listar Empresas
      description: Retorna las empresas que administra el contador autenticado.
      operationId: listar_empresas_api_v1_empresas_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v1/mis-empresas:
    post:
      tags:
      - Empresas
      summary: Agregar Empresa
      description: "Crea una empresa y la vincula al contador autenticado.\n\nSi el\
        \ RFC ya est\xE1 registrado solo responde con \xE9xito cuando el usuario ya\n\
        estaba vinculado (idempotente). Conocer un RFC no da derecho a ver los datos\n\
        de esa empresa: vincularse a una empresa existente se rechaza con 409."
      operationId: agregar_empresa_api_v1_mis_empresas_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgregarEmpresaRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/empresas/{empresa_id}:
    get:
      tags:
      - Empresas
      summary: Obtener Empresa
      operationId: obtener_empresa_api_v1_empresas__empresa_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: empresa_id
        in: path
        required: true
        schema:
          type: string
          title: Empresa Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
