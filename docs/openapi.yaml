  # ============================================================
  # SAT FIEL
  # ============================================================

  /api/v1/sat/solicitar:
    post:
      operationId: solicitarDescargaSAT
      tags: [SAT FIEL]
      summary: Solicitar descarga masiva al SAT
      description: |
        Envia una solicitud de descarga masiva de CFDIs al SAT usando la
        e.firma (FIEL) del contribuyente.

        **Flujo recomendado**:
        1. POST /solicitar — crear solicitud
        2. POST /solicitudes/{id}/verificar — verificar estado (puede tomar minutos)
        3. POST /solicitudes/{id}/descargar — descargar cuando este lista

        O bien usar POST /empresas/{id}/fiel/sync para el ciclo automatico.

        **Tipos**: emitidos | recibidos
        **Estado comprobante**: Vigente | Cancelado | Todos
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [empresa_id, tipo, fecha_inicio, fecha_fin, cer_file, key_file, password]
              properties:
                empresa_id:
                  type: string
                  format: uuid
                  description: ID de la empresa
                tipo:
                  type: string
                  enum: [emitidos, recibidos]
                  description: Tipo de CFDIs a descargar
                fecha_inicio:
                  type: string
                  format: date
                  description: Fecha de inicio del periodo (YYYY-MM-DD)
                  example: "2024-01-01"
                fecha_fin:
                  type: string
                  format: date
                  description: Fecha de fin del periodo (YYYY-MM-DD)
                  example: "2024-01-31"
                estado_comprobante:
                  type: string
                  enum: [Vigente, Cancelado, Todos]
                  default: Vigente
                  description: Estado de los comprobantes a descargar
                cer_file:
                  type: string
                  format: binary
                  description: Archivo .cer del certificado de la FIEL
                key_file:
                  type: string
                  format: binary
                  description: Archivo .key de la llave privada de la FIEL
                password:
                  type: string
                  description: Contrasena de la llave privada FIEL
      responses:
        '200':
          description: Solicitud enviada al SAT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudSATResponse'
              example:
                solicitud_id: "sol-uuid-0001"
                id_solicitud_sat: "SAT-UUID-XXXX"
                estado: solicitado
                mensaje: "Solicitud enviada al SAT. Usa /verificar para consultar el estado."
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: FIEL invalida o no se pudo cargar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Error en la comunicacion con el SAT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Error SAT: Certificado vencido"

  /api/v1/sat/solicitudes:
    get:
      operationId: listarSolicitudesSAT
      tags: [SAT FIEL]
      summary: Listar solicitudes de descarga masiva
      description: |
        Lista las ultimas 20 solicitudes de descarga masiva del SAT
        para la empresa especificada.
      parameters:
        - name: empresa_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la empresa
      responses:
        '200':
          description: Lista de solicitudes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SolicitudSAT'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/sat/solicitudes/{solicitud_id}/verificar:
    post:
      operationId: verificarSolicitudSAT
      tags: [SAT FIEL]
      summary: Verificar estado de solicitud en el SAT
      description: |
        Consulta el estado actual de una solicitud de descarga masiva en el SAT
        y actualiza el registro local.

        **Estados posibles**: en_proceso, terminado, fallo
      parameters:
        - name: solicitud_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la solicitud local
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cer_file, key_file, password]
              properties:
                cer_file:
                  type: string
                  format: binary
                key_file:
                  type: string
                  format: binary
                password:
                  type: string
      responses:
        '200':
          description: Estado actualizado de la solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificacionSATResponse'
              example:
                solicitud_id: "sol-uuid-0001"
                estado: terminado
                num_cfdi: 47
                num_paquetes: 2
                id_paquetes: ["pkg-uuid-001", "pkg-uuid-002"]
                mensaje: ""
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '502':
          $ref: '#/components/responses/GatewayError'

  /api/v1/sat/solicitudes/{solicitud_id}/descargar:
    post:
      operationId: descargarCFDISAT
      tags: [SAT FIEL]
      summary: Descargar paquetes ZIP del SAT e importar CFDIs
      description: |
        Descarga los paquetes ZIP del SAT en background, extrae los XMLs
        e importa los CFDIs a la base de datos. Al terminar ejecuta el
        pipeline completo (conciliacion + riesgos + scoring).

        La respuesta es inmediata (la descarga ocurre en background).
        Consultar el estado de la solicitud para saber cuando termino.
      parameters:
        - name: solicitud_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID de la solicitud
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cer_file, key_file, password, id_paquetes]
              properties:
                cer_file:
                  type: string
                  format: binary
                key_file:
                  type: string
                  format: binary
                password:
                  type: string
                id_paquetes:
                  type: string
                  description: Array JSON con los IDs de paquetes a descargar
                  example: '["pkg-uuid-001", "pkg-uuid-002"]'
      responses:
        '200':
          description: Descarga iniciada en background
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                  paquetes:
                    type: integer
                  solicitud_id:
                    type: string
              example:
                mensaje: "Descarga iniciada en background"
                paquetes: 2
                solicitud_id: "sol-uuid-0001"
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableError'

  /api/v1/sat/empresas/{empresa_id}/fiel/guardar:
    post:
      operationId: guardarFIEL
      tags: [SAT FIEL]
      summary: Guardar FIEL cifrada para la empresa
      description: |
        Guarda la e.firma (FIEL) del contribuyente de forma cifrada en la base
        de datos. Permite luego usar el sync automatico sin subir la FIEL
        manualmente cada vez. Reemplaza cualquier FIEL previa.

        La llave privada se almacena cifrada. La contrasena NO se guarda.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cer_file, key_file, password]
              properties:
                cer_file:
                  type: string
                  format: binary
                  description: Archivo .cer del certificado de la FIEL
                key_file:
                  type: string
                  format: binary
                  description: Archivo .key de la llave privada de la FIEL
                password:
                  type: string
                  description: Contrasena de la llave privada FIEL
      responses:
        '200':
          description: FIEL guardada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FIELGuardadaResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/sat/empresas/{empresa_id}/fiel/estado:
    get:
      operationId: estadoFIEL
      tags: [SAT FIEL]
      summary: Consultar estado de la FIEL guardada
      description: |
        Retorna los metadatos de la FIEL guardada para la empresa (rfc, vigencia,
        numero de certificado) sin exponer las credenciales.

        Si no hay FIEL guardada, retorna {"tiene_fiel": false}.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      responses:
        '200':
          description: Metadatos de la FIEL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FIELEstadoResponse'
              example:
                tiene_fiel: true
                rfc: "XAXX010101000"
                numero_certificado: "00001000000504465028"
                vigencia_inicio: "2022-01-01"
                vigencia_fin: "2026-01-01"
                vencida: false
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/sat/empresas/{empresa_id}/fiel:
    delete:
      operationId: eliminarFIEL
      tags: [SAT FIEL]
      summary: Eliminar FIEL guardada de la empresa
      description: Elimina la FIEL cifrada almacenada para la empresa.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      responses:
        '200':
          description: Resultado de la eliminacion
          content:
            application/json:
              schema:
                type: object
                properties:
                  eliminada:
                    type: boolean
              example:
                eliminada: true
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/sat/empresas/{empresa_id}/fiel/sync:
    post:
      operationId: syncCompletoFIEL
      tags: [SAT FIEL]
      summary: Sincronizacion automatica completa via FIEL guardada
      description: |
        Ejecuta el ciclo completo de descarga del SAT de forma automatica
        usando la FIEL previamente guardada:

        1. Solicita descarga al SAT
        2. Verifica en loop cada 30 segundos (maximo 30 minutos)
        3. Descarga paquetes ZIP e importa CFDIs
        4. Ejecuta pipeline completo (conciliacion + riesgos + scoring)

        Todo ocurre en background. Requiere FIEL guardada y vigente.

        **Tipo**: emitidos | recibidos | ambos. Cada tipo se pide por separado:
        si el SAT rechaza uno, el otro se sigue pidiendo y el rechazo llega en
        `errores` (responde 502 solo si no se aceptó ninguno; 409 si todos los
        tipos pedidos ya tienen una descarga en curso para ese periodo).

        **Solicitudes agotadas (CodEstatus 5002)**: el SAT limita de por vida
        las solicitudes con las mismas fechas y RFC. Si rechaza el mes
        completo, se vuelve a pedir partido en dos rangos contiguos (corte el
        dia 15, distinto en cada intento), que cubren el mes segundo a segundo;
        el mes queda en dos solicitudes de ese tipo.

        **Tope maximo (CodEstatus 5003, mas de 200,000 CFDI)**: la solicitud se
        parte en dos mitades por fecha, recursivamente hasta un dia.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [tipo, periodo]
              properties:
                tipo:
                  type: string
                  enum: [emitidos, recibidos, ambos]
                  description: Tipo de CFDIs a sincronizar
                periodo:
                  type: string
                  pattern: '^\d{4}-\d{2}$'
                  description: Periodo fiscal YYYY-MM
                  example: "2024-01"
      responses:
        '200':
          description: Sync iniciado en background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncIniciadoResponse'
              example:
                mensaje: "Sync iniciado para 2 tipo(s). Se verificara y descargara automaticamente."
                solicitudes:
                  - id: "sol-uuid-0001"
                    tipo: emitidos
                  - id: "sol-uuid-0002"
                    tipo: recibidos
                periodo: "2024-01"
                tipos: [emitidos, recibidos]
                errores: []
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          description: Sin FIEL guardada o FIEL vencida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "No hay FIEL guardada para esta empresa. Guardala primero."
        '409':
          $ref: '#/components/responses/ConflictError'
        '502':
          $ref: '#/components/responses/GatewayError'

  /api/v1/sat/empresas/{empresa_id}/sync/estado:
    get:
      operationId: estadoSyncSAT
      tags: [SAT FIEL]
      summary: Estado de la descarga automatica de la empresa
      description: |
        Estado de la descarga automatica de XML del SAT: si esta activa, en que
        estado esta (inactiva, sincronizando, al_dia, pausada, error), ultima y
        proxima corrida, quien dio el consentimiento y el progreso de la corrida
        en curso. Sin configuracion devuelve el estado "inactiva". Nunca incluye
        datos de la e.firma.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      responses:
        '200':
          description: Estado de la descarga automatica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncEstadoResponse'
              example:
                activa: true
                estado: sincronizando
                motivo_pausa: null
                ultima_exitosa: null
                proxima_corrida: "2026-10-04T02:10:00+00:00"
                carga_inicial_ok: false
                consentimiento_por: "6f1c7a58-0b7e-4f0e-9d63-8a3a3d1d2a11"
                consentimiento_el: "2026-10-04T02:10:00+00:00"
                progreso: {total: 44, terminadas: 12, fallidas: 0}
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/sat/empresas/{empresa_id}/sync/config:
    put:
      operationId: configurarSyncSAT
      tags: [SAT FIEL]
      summary: Activar o desactivar la descarga automatica
      description: |
        Activa o desactiva la descarga automatica de la empresa. **Activar exige
        `consentimiento: true`**: el sistema usara la e.firma guardada sin
        intervencion de una persona. Tambien exige una e.firma guardada y vigente.
        Quien activa y cuando queda registrado, y cada cambio en `auditoria`.
        Activar una empresa que ya esta activa no reinicia la corrida en curso.
        La carga inicial (ejercicio anterior y en curso) la crea el worker en su
        siguiente ciclo. Limite: 10 por minuto.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activa]
              properties:
                activa:
                  type: boolean
                consentimiento:
                  type: boolean
                  default: false
                  description: Obligatorio en true para activar
            example:
              activa: true
              consentimiento: true
      responses:
        '200':
          description: Estado resultante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncEstadoResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Falta el consentimiento, o no hay e.firma guardada y vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "La e.firma guardada esta vencida. Actualizala."

  /api/v1/sat/empresas/{empresa_id}/sync/ahora:
    post:
      operationId: syncAhoraSAT
      tags: [SAT FIEL]
      summary: Actualizar ahora (forzar una corrida)
      description: |
        Adelanta la proxima corrida para que el worker la tome en su siguiente
        ciclo. Requiere la descarga automatica activa y una e.firma vigente; si ya
        hay una corrida en curso responde 409. Queda en `auditoria`. Limite: 5 por
        minuto.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      responses:
        '200':
          description: Estado resultante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncEstadoResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '422':
          description: La descarga automatica no esta activa, o no hay e.firma vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/sat/empresas/{empresa_id}/fiel/sync/avanzar:
    post:
      operationId: avanzarSyncFIEL
      tags: [SAT FIEL]
      summary: Dar una pasada a las descargas en curso
      description: |
        Verifica en el SAT cada solicitud en curso de la empresa usando la FIEL
        guardada y, si ya esta lista, descarga sus paquetes e importa los CFDIs
        dentro de la misma llamada.

        Complementa a `/fiel/sync` en entornos donde el proceso no sobrevive al
        request (serverless) y el loop en background se corta: el frontend lo
        llama periodicamente mientras haya descargas en curso.

        Es seguro llamarlo varias veces: cada solicitud se verifica en el SAT
        como mucho una vez cada 20 segundos y solo una pasada hace la descarga.
        Una importacion sin avance durante 10 minutos se considera interrumpida
        y se retoma desde el primer paquete sin importar. Si un paquete no se
        puede descargar, la solicitud se queda en `terminado` (con el motivo en
        `error_msg`) y se reintenta en la siguiente pasada; tras 3 intentos
        fallidos del mismo paquete la solicitud queda en `fallo`.

        Al terminar se cuadran los CFDI importados contra los que reporto el
        SAT: si faltan, la solicitud queda `descargado` con el aviso de descarga
        incompleta en `error_msg`. Si el SAT no encontro CFDI en el periodo
        (CodigoEstadoSolicitud 5004), queda `descargado` con cero CFDI.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      responses:
        '200':
          description: Estado en que quedo cada solicitud atendida en esta pasada
          content:
            application/json:
              schema:
                type: object
                required: [avanzadas]
                properties:
                  avanzadas:
                    type: array
                    items:
                      type: object
                      required: [id, estado]
                      properties:
                        id:
                          type: string
                          format: uuid
                        estado:
                          type: string
                          enum: [solicitado, en_proceso, terminado, descargado, fallo]
              example:
                avanzadas:
                  - id: "sol-uuid-0001"
                    estado: descargado
                  - id: "sol-uuid-0002"
                    estado: en_proceso
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Sin FIEL guardada o FIEL que no se pudo cargar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "No hay FIEL guardada para esta empresa"

