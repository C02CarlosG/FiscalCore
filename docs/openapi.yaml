                      properties:
                        registrado_por: { type: string, nullable: true, description: Correo de quien lo registró }
                        motivo_anulacion: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      operationId: registrarPagoDeCuenta
      tags: [Suscripción]
      summary: Registra un pago recibido fuera de la plataforma y extiende la vigencia (D10, sin cobro en línea)
      description: |
        Fecha no futura; monto mayor que 0 con hasta dos decimales, como texto. En la misma
        transacción extiende `vigente_hasta` `meses` meses: desde la vigencia si no había
        vencido a la fecha del pago, si no desde la fecha del pago. 409 si la cuenta no
        tiene plan asignado. Se audita `suscripcion.registrar_pago`.
      parameters:
        - { name: usuario_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fecha, monto]
              properties:
                fecha: { type: string, format: date }
                monto: { type: string, example: '1499.00' }
                referencia: { type: string, maxLength: 200, nullable: true }
                folio_cfdi: { type: string, maxLength: 40, nullable: true, description: Folio del CFDI emitido por la suscripción }
                uuid_cfdi: { type: string, nullable: true, description: UUID del CFDI emitido a mano }
                meses: { type: integer, minimum: 1, maximum: 24, default: 1, description: Meses que extiende la vigencia }
      responses:
        '201':
          description: Pago registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagoSuscripcion' }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: La cuenta no tiene plan asignado
        '422':
          description: Dato inválido

  /api/v1/suscripcion/admin/cuentas/{usuario_id}/pagos/{pago_id}/anular:
    post:
      operationId: anularPagoDeCuenta
      tags: [Suscripción]
      summary: Anula un pago (no se borra) y revierte la vigencia si nada la cambió después (en cadena sobre pagos ya anulados)
      parameters:
        - { name: usuario_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: pago_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Anulado
          content:
            application/json:
              schema:
                type: object
                properties:
                  vigencia_revertida: { type: boolean }
                  vigente_hasta: { type: string, format: date, nullable: true, description: Vigencia resultante }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: La cuenta no existe, o no hay un pago activo con ese id en ella
        '422':
          description: Falta el motivo

  /api/v1/suscripcion/admin/vencimientos:
    get:
      operationId: vencimientosSuscripcion
      tags: [Suscripción]
      summary: Cuentas activas que vencen en 15 días o menos, o ya vencidas (solo admin de la plataforma)
      responses:
        '200':
          description: De la que vence antes a la que vence después (hasta 500)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    usuario_id: { type: string, format: uuid }
                    email: { type: string }
                    nombre: { type: string, nullable: true }
                    plan_clave: { type: string }
                    plan_nombre: { type: string }
                    vigente_hasta: { type: string, format: date }
                    dias_para_vencer: { type: integer, description: Negativo si ya venció }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/suscripcion/admin/cuentas/{usuario_id}:
    put:
      operationId: asignarSuscripcion
      tags: [Suscripción]
      summary: Asignar plan a una cuenta (pago registrado aparte)
      parameters:
        - { name: usuario_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_clave]
              properties:
                plan_clave: { type: string }
                estado: { type: string, enum: [activa, suspendida, cancelada], default: activa }
                vigente_hasta: { type: string, format: date, nullable: true }
                notas: { type: string, nullable: true, maxLength: 1000 }
      responses:
        '200':
          description: Suscripción resultante de la cuenta (mismo formato que GET /suscripcion)
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/UnprocessableError'

  /api/v1/suscripcion/admin/planes/{clave}:
    put:
      operationId: editarPlan
      tags: [Suscripción]
      summary: Editar un plan (o crearlo si la clave no existe)
      parameters:
        - { name: clave, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_]{1,29}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, precio_mensual]
              properties:
                nombre: { type: string, maxLength: 80 }
                precio_mensual: { type: string, description: MXN sin IVA }
                max_rfc: { type: integer, nullable: true, minimum: 0, maximum: 2147483647, description: null = ilimitado }
                activo: { type: boolean, default: true }
      responses:
        '200':
          description: Plan guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plan' }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '422':
          description: Clave de validación desconocida o umbral fuera de 0 a 2,000
          $ref: '#/components/responses/UnprocessableError'

  /api/v1/cuenta/contrasena:
    post:
      operationId: cambiarContrasena
      tags: [Cuenta]
      summary: Cambiar la contraseña del usuario autenticado
      description: Exige la contraseña actual. Límite de 5 intentos por minuto. U1, carril D.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actual, nueva]
              properties:
                actual: { type: string }
                nueva: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '204':
          description: Contraseña cambiada
        '400':
          description: La contraseña actual no es correcta
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          description: Contraseña nueva inválida o igual a la actual
        '429':
          description: Demasiados intentos

  /api/v1/cuenta/empresas/{empresa_id}/usuarios:
    get:
      operationId: listarUsuariosEmpresa
      tags: [Cuenta]
      summary: Usuarios con acceso a la empresa y su rol
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      responses:
        '200':
          description: Usuarios de la empresa
          content:
            application/json:
              schema:
                type: object
                properties:
                  mi_rol: { type: string, nullable: true, enum: [administrador, contador, null] }
                  puede_administrar: { type: boolean }
                  usuarios: { type: array, items: { $ref: '#/components/schemas/UsuarioEmpresa' } }
                  invitaciones:
                    type: array
                    description: Pendientes; vacía si quien consulta no administra la empresa.
                    items: { $ref: '#/components/schemas/InvitacionEmpresa' }
                  por_aprobar:
                    type: array
                    description: |
                      Aceptaciones que esperan la aprobación de un administrador (doble
                      confirmación); vacía si quien consulta no administra la empresa.
                    items: { $ref: '#/components/schemas/AceptacionPorAprobar' }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/cuenta/empresas/{empresa_id}/usuarios/{usuario_id}:
    patch:
      operationId: cambiarRolUsuarioEmpresa
      tags: [Cuenta]
      summary: Cambiar el rol de un usuario en la empresa
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: usuario_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rol]
              properties:
                rol: { type: string, enum: [administrador, contador] }
      responses:
        '200':
          description: Rol cambiado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioEmpresa' }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: La empresa se quedaría sin administrador
        '422':
          $ref: '#/components/responses/UnprocessableError'
    delete:
      operationId: quitarUsuarioEmpresa
      tags: [Cuenta]
      summary: Quitar el acceso a la empresa (no borra la cuenta)
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: usuario_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Acceso retirado
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: La empresa se quedaría sin administrador

  /api/v1/cuenta/empresas/{empresa_id}/invitaciones:
    post:
      operationId: invitarAEmpresa
      tags: [Cuenta]
      summary: Invitar un correo a la empresa
      description: |
        Solo un administrador de la empresa (o de la plataforma). La respuesta es la misma
        exista o no una cuenta con ese correo; la persona acepta desde su perfil (o al
        registrarse con ese correo). La invitación vence a los 7 días; re-invitar la renueva.
        Límite: 20 por hora por usuario.
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, rol]
              properties:
                email: { type: string }
                rol: { type: string, enum: [administrador, contador] }
      responses:
        '201':
          description: Invitación pendiente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitacionEmpresa' }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Esa persona ya tiene acceso a la empresa, o ya aceptó una invitación que espera aprobación (no se cambia su rol ni su plazo)
        '422':
          description: Correo o rol inválido, o el correo es el propio
        '429':
          description: Demasiadas invitaciones

  /api/v1/cuenta/empresas/{empresa_id}/invitaciones/{invitacion_id}:
    delete:
      operationId: cancelarInvitacion
      tags: [Cuenta]
      summary: Cancelar una invitación pendiente
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: invitacion_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Cancelada
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/cuenta/empresas/{empresa_id}/invitaciones/{invitacion_id}/aprobar:
    post:
      operationId: aprobarAceptacion
      tags: [Cuenta]
      summary: Aprobar a quien aceptó una invitación (le da acceso con el rol invitado)
      description: |
        Solo administradores de la empresa (o de la plataforma). El vínculo se crea en la
        misma transacción que bloquea los vínculos de la empresa. Se audita
        (`cuenta.aprobar_invitacion`).
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: invitacion_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Aprobada; la persona ya tiene acceso
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: No hay una aceptación vigente con ese id en esta empresa (no existe, es de otra empresa, ya se resolvió o venció)
        '409':
          description: |
            El correo de la cuenta que aceptó ya no identifica a una sola persona (otra cuenta con
            el mismo correo en minúsculas, o la cuenta ya no tiene el correo invitado); se audita
            `cuenta.correo_ambiguo`. También si el catálogo de planes no tiene plan por defecto.

  /api/v1/cuenta/empresas/{empresa_id}/invitaciones/{invitacion_id}/rechazar:
    post:
      operationId: rechazarAceptacion
      tags: [Cuenta]
      summary: Rechazar a quien aceptó una invitación (no le da acceso)
      description: Solo administradores. Se audita (`cuenta.rechazar_aceptacion`).
      parameters:
        - $ref: '#/components/parameters/EmpresaId'
        - { name: invitacion_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Rechazada
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: No hay una aceptación vigente con ese id en esta empresa

  /api/v1/cuenta/invitaciones:
    get:
      operationId: misInvitaciones
      tags: [Cuenta]
      summary: Invitaciones pendientes y vigentes (7 días) al correo de la cuenta
      description: |
        Incluye las que esta cuenta ya aceptó y esperan aprobación (`aceptada_pendiente`).
        Vacía si hay más de una cuenta con el mismo correo en minúsculas (se audita) o si la
        empresa está inactiva.
      responses:
        '200':
          description: Invitaciones pendientes
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    rol: { type: string, enum: [administrador, contador] }
                    estado: { type: string, enum: [pendiente, aceptada_pendiente] }
                    creada: { type: string, format: date-time }
                    rfc: { type: string }
                    razon_social: { type: string }
                    invitada_por: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/cuenta/invitaciones/{invitacion_id}/aceptar:
    post:
      operationId: aceptarInvitacion
      tags: [Cuenta]
      summary: Aceptar una invitación (queda por aprobar; todavía no da acceso)
      description: |
        Doble confirmación: la invitación pasa a `aceptada_pendiente` y un administrador de
        la empresa debe aprobarla en los siguientes 7 días para que se cree el acceso.
      parameters:
        - { name: invitacion_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Aceptada, por aprobar
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado: { type: string, enum: [aceptada_pendiente] }
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: No existe, no es de este correo o ya se respondió

  /api/v1/cuenta/invitaciones/{invitacion_id}/rechazar:
    post:
      operationId: rechazarInvitacion
      tags: [Cuenta]
      summary: Rechazar una invitación
      parameters:
        - { name: invitacion_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204':
          description: Rechazada
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: No existe, no es de este correo o ya se respondió

# ============================================================
# COMPONENTS
# ============================================================

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token JWT obtenido al registrarse o hacer login.
        Incluir en el header: Authorization: Bearer {token}
        Duracion: 8 horas.

  parameters:
    EmpresaId:
      name: empresa_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID unico de la empresa (UUID)
      example: "a1b2c3d4-0001-0001-0001-000000000001"

  responses:
    UnauthorizedError:
      description: Token JWT ausente, invalido o expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "Se requiere autenticacion"

    ForbiddenError:
      description: El usuario no tiene acceso a este recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "Sin acceso a esta empresa"

    NotFoundError:
      description: El recurso solicitado no existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "Empresa no encontrada"

    BadRequestError:
      description: La solicitud contiene datos invalidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "Sin campos para actualizar"

    ConflictError:
      description: El recurso ya existe (conflicto)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "El correo ya esta registrado"

    UnprocessableError:
      description: La entidad no pudo procesarse (datos semanticamente invalidos)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "FIEL invalida: certificado corrupto"

    InternalError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "Error inesperado en el servidor"

    GatewayError:
      description: Error en la comunicacion con el SAT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "Error SAT: Servicio no disponible"

  schemas:
    Declaracion:
      type: object
      properties:
        periodo: { type: string }
        impuesto: { type: string, enum: [iva, isr] }
        secuencia: { type: integer, description: "1 = normal; 2, 3... = complementarias" }
        declaraciones: { type: integer, description: "Solo en el listado del ejercicio: cuantas lleva el historial" }
        tipo: { type: string, enum: [normal, complementaria] }
        fecha_presentacion: { type: string, format: date, nullable: true }
        numero_operacion: { type: string, nullable: true }
        ingresos: { type: number, nullable: true }
        deducciones: { type: number, nullable: true }
        impuesto_trasladado: { type: number, nullable: true }
        impuesto_acreditable: { type: number, nullable: true }
        retenciones: { type: number, nullable: true }
        retenciones_a_terceros: { type: number, nullable: true }
        saldo_a_favor_aplicado: { type: number, nullable: true }
        impuesto_a_cargo: { type: number, nullable: true }
        monto_pagado: { type: number, nullable: true }
        notas: { type: string }
        updated_at: { type: string, format: date-time }
    Proveedor:
      type: object
      properties:
        id: { type: string, format: uuid }
        rfc: { type: string }
        nombre: { type: string }
        nombre_editado: { type: boolean }
        tipo_tercero: { type: string, enum: ['04', '05', '15'], nullable: true, description: "Catalogo por confirmar contra el instructivo oficial del SAT" }
        tipo_operacion: { type: string, enum: ['02', '03', '06', '07', '08', '85', '87'], nullable: true, description: "La 87 solo con tercero 15" }
        pais: { type: string, minLength: 3, maxLength: 3, nullable: true, description: "ISO 3166-1 alfa-3" }
        jurisdiccion_detalle: { type: string, nullable: true }
        id_fiscal: { type: string, nullable: true }
        efectos_fiscales: { type: boolean, nullable: true }
        origen: { type: string, enum: [cfdi, manual] }
        pendiente: { type: boolean, description: "Extranjero sin pais o sin ID fiscal" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          description: Descripcion del error

    UsuarioAdmin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        nombre:
          type: string
        rol:
          type: string
          enum: [admin, contador]
        activo:
          type: boolean
        created_at:
          type: string
          format: date-time
        empresas:
          type: array
          items:
            type: object
            properties:
              empresa_id: { type: string, format: uuid }
              rfc: { type: string }
              razon_social: { type: string }

    CategoriaMovimiento:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        tipo:
          type: string
          enum: [deposito, retiro, ambos]
        color:
          type: string

    HealthResponse:
      type: object
      properties:
        estado:
          type: string
          example: operativo
        version:
          type: string
          example: "1.0.0"

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Correo electronico del contador
        password:
          type: string
          minLength: 8
          description: Contrasena de acceso
        nombre:
          type: string
          nullable: true
          description: Nombre completo del contador

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT de acceso
        token_type:
          type: string
          example: bearer
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nombre:
          type: string
          nullable: true
        rol:
          type: string
          enum: [admin, contador]
          description: Rol del usuario; la interfaz lo muestra bajo su nombre.
        empresas:
          type: array
          items:
            $ref: '#/components/schemas/EmpresaResumen'

    UsuarioPerfil:
      type: object
      properties:
        id:
          type: string
          format: uuid
